<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語音声認識</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;color:#172033}h1{font-size:26px}input{box-sizing:border-box;width:100%;font-size:18px;padding:12px;margin:8px 0 14px}button{font-size:16px;font-weight:700;padding:12px 16px;border:0;border-radius:9px;background:#1764ed;color:white;margin:0 6px 8px 0}button:disabled{opacity:.5}#status{white-space:pre-wrap;background:#f1f3f6;border-radius:10px;padding:14px;margin-top:12px;line-height:1.6}.note{font-size:13px;color:#555}</style></head>
<body><h1>英語音声認識</h1><p>「マイクで認識」を押してから、表示された英文を声に出してください。</p>
<label for="target">読み上げる英文</label><input id="target" value="How are you today?"><div><button id="listen">お手本を聞く</button><button id="recognize">マイクで認識</button><button id="stop" disabled>停止</button></div><div id="status">準備完了。認識開始はボタンを押したときだけ行います。</div><p class="note">このページは音声を保存・送信するコードを含みません。ブラウザのWeb Speech API自体が外部認識サービスを利用する場合はあります。認識結果は、正規のGASアプリから開かれた場合のみ opener に返します。</p>
<script>
(function(){
 const params=new URLSearchParams(location.search); const requestId=params.get('requestId')||''; const targetParam=params.get('target'); const target=document.getElementById('target'); const status=document.getElementById('status'); const listen=document.getElementById('listen'); const recognize=document.getElementById('recognize'); const stop=document.getElementById('stop');
 if(targetParam) target.value=targetParam.slice(0,500);
 let rec=null, sent=false;
 function sendResult(payload){ if(sent)return; sent=true; if(window.opener && !window.opener.closed && requestId){ window.opener.postMessage(Object.assign({type:'ENGLISH_SPEECH_RESULT',requestId:requestId},payload),'*'); } }
 listen.onclick=function(){ if(!window.speechSynthesis){status.textContent='このブラウザではお手本音声を再生できません。';return;} speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(target.value);u.lang='en-US';speechSynthesis.speak(u); };
 recognize.onclick=function(){
   const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!Recognition){status.textContent='このブラウザは音声認識に対応していません。';return;}
   try{if(rec){try{rec.abort()}catch(e){}} rec=new Recognition();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3;recognize.disabled=true;stop.disabled=false;status.textContent='マイクに向かって英文を話してください…';
    rec.onresult=function(e){const transcript=Array.from(e.results[0]).map(x=>x.transcript).join(' ');status.textContent='認識結果：'+transcript+'\nGASアプリへ結果を返しています。';sendResult({transcript:transcript});};
    rec.onerror=function(e){status.textContent='音声認識エラー：'+(e.error||'unknown');sendResult({error:e.error||'unknown'});};
    rec.onend=function(){recognize.disabled=false;stop.disabled=true;};rec.start();
   }catch(e){recognize.disabled=false;stop.disabled=true;status.textContent='開始エラー：'+(e.name||'Error')+' '+(e.message||'');sendResult({error:(e.name||'Error')+': '+(e.message||'')});}
 };
 stop.onclick=function(){if(rec){try{rec.stop()}catch(e){}}};
 if(!window.opener){status.textContent='単独テストモードです。GASアプリから開いた場合、認識結果を元の画面へ返します。';}
})();
</script></body></html>
