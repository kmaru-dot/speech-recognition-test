<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英語音声認識テスト</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;line-height:1.6;color:#222}button{font-size:16px;padding:12px 16px;margin:6px 4px 6px 0;border:0;border-radius:8px;background:#155eef;color:#fff}button:disabled{opacity:.5}#status{padding:12px;background:#f2f4f7;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}.small{color:#555;font-size:14px}
</style>
</head>
<body>
<h1>英語音声認識テスト</h1>
<p>これはGASアプリとは別のページで、ブラウザの英語音声認識が利用できるかを確認するテストです。</p>
<label for="target">読み上げる英文（任意）</label><br>
<input id="target" value="How are you today?" style="box-sizing:border-box;width:100%;font-size:18px;padding:10px;margin:8px 0">
<div><button id="speak">お手本を聞く</button><button id="start">マイクで認識</button><button id="stop" disabled>停止</button></div>
<div id="status">準備完了。まず「マイクで認識」を押してください。</div>
<p class="small">注意：マイク利用はボタンを押したときだけ開始します。音声や認識結果はこのテストページ内で表示し、サーバーには送信しません。</p>
<script>
const statusEl=document.getElementById('status');
const startBtn=document.getElementById('start');
const stopBtn=document.getElementById('stop');
let recognition=null;
function show(s){statusEl.textContent=s;}
document.getElementById('speak').addEventListener('click',()=>{
 const text=document.getElementById('target').value.trim();
 if(!text){show('英文を入力してください。');return;}
 if(!('speechSynthesis' in window)){show('このブラウザは音声読み上げに対応していません。');return;}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.onstart=()=>show('お手本を再生中…');u.onend=()=>show('お手本の再生が完了しました。');u.onerror=e=>show('読み上げエラー：'+e.error);speechSynthesis.speak(u);
});
startBtn.addEventListener('click',()=>{
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){show('SpeechRecognition APIに未対応です。');return;}
 try{
  recognition=new R();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=3;
  recognition.onstart=()=>{show('マイク開始成功。英語を話してください…');startBtn.disabled=true;stopBtn.disabled=false;};
  recognition.onaudiostart=()=>show('音声入力を取得中です。英語を話してください…');
  recognition.onresult=e=>{const alternatives=Array.from(e.results[0]).map(x=>x.transcript+' (信頼度 '+(typeof x.confidence==='number'?x.confidence.toFixed(2):'不明')+')');show('認識成功\n'+alternatives.join('\n'));};
  recognition.onerror=e=>show('音声認識エラー：'+e.error+'\nsecureContext='+window.isSecureContext+'\norigin='+location.origin+'\niframe内='+(window.top!==window.self));
  recognition.onend=()=>{startBtn.disabled=false;stopBtn.disabled=true;};
  recognition.start();show('音声認識を要求しています…');
 }catch(e){show('開始例外：'+e.name+' / '+e.message);startBtn.disabled=false;stopBtn.disabled=true;}
});
stopBtn.addEventListener('click',()=>{if(recognition)recognition.stop();});
</script>
</body>
</html>
