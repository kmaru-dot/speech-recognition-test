<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語音声認識</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17212b;background:#f4f7fb}body{margin:0;padding:18px}.card{max-width:560px;margin:0 auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 24px #17324d12}h1{font-size:1.35rem;margin:0 0 8px}.target{font-size:1.35rem;font-weight:750;padding:14px;border-radius:12px;background:#edf5ff;line-height:1.5}.status{min-height:3em;line-height:1.5;color:#374151}.result{padding:12px;background:#f5f7fa;border-radius:10px;min-height:2em;overflow-wrap:anywhere}.buttons{display:grid;gap:10px;margin-top:14px}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;cursor:pointer;background:#1769d2;color:#fff}button.secondary{background:#e8edf3;color:#182230}button:disabled{opacity:.55;cursor:default}.small{font-size:.88rem;color:#5a6572;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<h1>英語の音声認識</h1>
<p class="small">学習アプリから開いた専用ページです。マイクを許可して、下の英文を声に出してください。</p>
<div id="target" class="target">英文を読み込んでいます…</div>
<p id="status" class="status" role="status" aria-live="polite">準備中…</p>
<div><strong>認識結果</strong><div id="result" class="result">まだ認識していません。</div></div>
<div class="buttons">
<button id="start">🎙️ マイクを開始</button>
<button id="send" disabled>結果を学習アプリに返す</button>
<button id="close" class="secondary">閉じる</button>
</div>
<p class="small">マイク権限を求められたら「許可」を選択してください。認識結果を返すと、このウィンドウは閉じます。</p>
</main>
<script>
(function(){
  'use strict';
  const params=new URLSearchParams(location.search);
  const target=params.get('target')||'';
  const requestId=params.get('requestId')||'';
  const returnOrigin=params.get('returnOrigin')||'';
  const targetEl=document.getElementById('target');
  const statusEl=document.getElementById('status');
  const resultEl=document.getElementById('result');
  const startBtn=document.getElementById('start');
  const sendBtn=document.getElementById('send');
  let transcript='';
  let recognition=null;
  targetEl.textContent=target||'学習アプリから英文が渡されていません。';
  const allowedOrigin=(function(){try{const u=new URL(returnOrigin);const h=u.hostname;return u.protocol==='https:'&&(h==='script.google.com'||h==='script.googleusercontent.com'||h.endsWith('.script.googleusercontent.com')||h.endsWith('-script.googleusercontent.com'));}catch(e){return false;}})();
  if(!target||!requestId||!allowedOrigin){
    statusEl.textContent='起動情報を確認できません。学習アプリから開き直してください。';
    startBtn.disabled=true;
  }
  function setStatus(s){statusEl.textContent=s;}
  function startRecognition(){
    const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!Recognition){setStatus('このブラウザは音声認識に対応していません。Chromeの最新版でお試しください。');return;}
    try{
      if(recognition){try{recognition.abort();}catch(e){}}
      recognition=new Recognition();
      recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=3;
      startBtn.disabled=true;sendBtn.disabled=true;setStatus('マイクを起動しています…');
      recognition.onstart=function(){setStatus('マイクが有効です。英文を声に出してください。');};
      recognition.onresult=function(event){
        transcript=Array.from(event.results[0]||[]).map(function(x){return x.transcript;}).join(' ').trim();
        resultEl.textContent=transcript||'音声を認識できませんでした。';
        sendBtn.disabled=!transcript;
        if(transcript){
          setStatus('認識できました。学習アプリに自動返却しています…');
          sendResult();
        }else{
          setStatus('音声を認識できませんでした。もう一度お試しください。');
        }
      };
      recognition.onerror=function(event){
        const code=event&&event.error?event.error:'unknown';
        const tips={
          'not-allowed':'サイトのマイク権限、OS設定、ブラウザの制限を確認してください。',
          'service-not-allowed':'ブラウザまたは音声認識サービスが利用を拒否しました。',
          'audio-capture':'利用できるマイクが見つからない可能性があります。',
          'network':'音声認識サービスへの接続に失敗しました。',
          'no-speech':'音声が検出されませんでした。マイクに向かって話してください。'
        };
        setStatus('音声認識エラー：'+code+'。'+(tips[code]||'もう一度お試しください。'));
        startBtn.disabled=false;
      };
      recognition.onend=function(){startBtn.disabled=false;};
      recognition.start();
    }catch(e){setStatus('開始できませんでした：'+(e&&e.name?e.name:'Error')+' '+(e&&e.message?e.message:''));startBtn.disabled=false;}
  }
  startBtn.addEventListener('click', startRecognition);
  // 起動情報が正しければ自動開始を試す。拒否された場合は手動ボタンで再試行。
  if(target && requestId && allowedOrigin){
    setStatus('音声認識を自動で開始しています…');
    startRecognition();
  }
  let resultSending=false;
  function sendResult(){
    if(resultSending)return;
    if(!transcript){setStatus('認識結果がありません。英文を読み上げてください。');return;}
    if(!window.opener||window.opener.closed){setStatus('学習アプリの画面が見つかりません。学習アプリの画面を閉じずに開き直してください。');return;}
    if(!allowedOrigin){setStatus('返却先の確認に失敗しました。学習アプリから開き直してください。');return;}

    resultSending=true;
    sendBtn.disabled=true;
    setStatus('認識結果を学習アプリへ送信しています…');

    // postMessageは受信側の処理完了を返さないため、短時間に複数回送信する。
    // GAS側はrequestIdとfinishedフラグで重複を無視する。
    const payload={type:'ENGLISH_SPEECH_RESULT',requestId:requestId,transcript:transcript};
    let attempts=0;
    const sendAgain=function(){
      if(!window.opener||window.opener.closed){
        setStatus('学習アプリの画面が見つかりません。結果を返せませんでした。');
        sendBtn.disabled=false;
        resultSending=false;
        return;
      }
      try{
        window.opener.postMessage(payload,returnOrigin);
        attempts++;
        setStatus('学習アプリへ送信しました（確認中 '+attempts+'/4）…');
      }catch(e){
        setStatus('結果の送信に失敗しました。送信ボタンで再試行してください。');
        sendBtn.disabled=false;
        resultSending=false;
        return;
      }
      if(attempts<4){
        setTimeout(sendAgain,300);
      }else{
        setStatus('結果を送信しました。学習アプリ側に反映されているか確認してください。');
        setTimeout(function(){window.close();},700);
      }
    };
    sendAgain();
  }
  sendBtn.addEventListener('click',sendResult);
  document.getElementById('close').addEventListener('click',function(){window.close();});
})();
</script>
</body>
</html>
